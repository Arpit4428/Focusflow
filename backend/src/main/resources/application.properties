# Application Configuration
server.port=${PORT:8080}
spring.application.name=focusflow-backend

# MongoDB Configuration
# Supports local MongoDB Community Server or MongoDB Atlas cloud connection URI
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/focusflow}
spring.data.mongodb.auto-index-creation=true

# JWT Security Configuration
jwt.secret=${JWT_SECRET:focusFlowSuperSecretSigningKeyForAcademicVivaDemo2026}
jwt.expiration=86400000

# Asynchronous Multithreading Configuration (Unit 3 Core Concept)
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=FocusFlowAsync-

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://veyro-iota.vercel.app}
